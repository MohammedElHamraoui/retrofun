[project]
name = "retrofun"
version = "0.4.0"
description = "Modern PostgreSQL + Python learning project following SQLAlchemy 2 In Practice, updated for Python 3.13 + uv."
readme = "README.md"
authors = [
    { name = "Mohammed El Hamraoui", email = "92893757+MohammedElHamraoui@users.noreply.github.com" },
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastuuid7>=0.6.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.2",
]

[project.urls]
Homepage = "https://github.com/MohammedElHamraoui/retrofun"
Repository = "https://github.com/MohammedElHamraoui/retrofun.git"
Documentation = "https://github.com/MohammedElHamraoui/retrofun/tree/main/docs"
Issues = "https://github.com/MohammedElHamraoui/retrofun/issues"
Changelog = "https://github.com/MohammedElHamraoui/retrofun/tags"

[project.scripts]
retrofun = "retrofun.main:main" # ✅ Points to the actual query runner

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=2.4.1", "ruff>=0.17.5", "pylint>=4.1.4", "sqlalchemy>=2.1.8"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["retrofun"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
