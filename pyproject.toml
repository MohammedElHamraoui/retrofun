[project]
name = "retrofun"
version = "0.1.0"
description = "PostgreSQL + Python learning project: psycopg 3, connection pooling, pydantic-settings."
readme = "README.md"
authors = [
    { name = "Mohammed El Hamraoui", email = "92893757+MohammedElHamraoui@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.2",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
retrofun = "retrofun:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
